<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<form>
			<fieldset>
				<h2>Ваши личные данные</h2>
				<label>
					Ваше имя
					<input type="text" placeholder="Имя" inputmode="text" required />
				</label>
				<label>
					Ваш возраст
					<input
						type="number"
						placeholder="Возраст"
						inputmode="numeric"
						required
					/>
				</label>
				<label>
					Ваш номер телефона
					<input
						type="tel"
						placeholder="Номер телефон"
						inputmode="tel"
						required
					/>
				</label>
				<label>
					Ваша почта
					<input type="email" placeholder="Почта" inputmode="email" required />
				</label>
				<label>
					Сообщение
					<textarea
						required
						name="message"
						placeholder="Ваше сообщение"
					></textarea>
				</label>
			</fieldset>
			<fieldset>
				<label>
					<input class="qwe" type="checkbox" />
					Я принимаю правила
				</label>
			</fieldset>
			<button>Отправить</button>
		</form>
	</body>
</html>
